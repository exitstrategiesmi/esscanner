# Build the ESScanner shell as an UNSIGNED .ipa.
#
# This is the verified $0 route (see
# ~/workspace/estimator-dev/research/MAC-FREE-BUILD-ROUTES-2026-11-07.md):
# a public repo gets free unlimited standard macOS runners, Xcode is
# preinstalled, the build is unsigned (CODE_SIGNING_ALLOWED=NO), and
# SideStore re-signs on the phone with the owner's free Apple ID.
#
# Trigger on push to main and manually on demand.

name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ESScanner/**"
      - "ESScanner.xcodeproj/**"
      - ".github/workflows/build-unsigned.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode version
        run: |
          ls /Applications | grep Xcode || true
          sudo xcode-select -p || true
          xcodebuild -version

      - name: Build unsigned
        run: |
          xcodebuild build \
            -project ESScanner.xcodeproj \
            -target ESScanner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned .ipa
        run: |
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr ESScanner-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ESScanner-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESScanner-unsigned-ipa
          path: ESScanner-unsigned.ipa
          retention-days: 14
