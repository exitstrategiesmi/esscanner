name: Replace pbxproj (temporary)

on:
  push:
    branches: [main]
    paths:
      - "project.pbxproj"
      - ".github/workflows/replace-pbxproj.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Move corrected project file into place
        run: |
          set -euo pipefail
          test -f project.pbxproj
          cp project.pbxproj ESScanner.xcodeproj/project.pbxproj
          rm project.pbxproj
          rm .github/workflows/replace-pbxproj.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix project SDKROOT per-SDK so iOS target resolves"
          git push
