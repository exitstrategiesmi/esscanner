name: Unzip bundle (temporary)

on:
  push:
    branches: [main]
    paths:
      - "esscanner-bundle.zip"
      - ".github/workflows/unzip-bundle.yml"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract bundle and commit project files
        run: |
          set -euo pipefail
          test -f esscanner-bundle.zip
          unzip -o esscanner-bundle.zip
          rm esscanner-bundle.zip
          rm .github/workflows/unzip-bundle.yml
          # GITHUB_TOKEN cannot push workflow files, so the bundle's
          # build-unsigned.yml is left out here and will be added
          # manually through the GitHub web UI instead.
          rm -f .github/workflows/build-unsigned.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ESScanner RoomPlan companion - initial upload"
          git push
